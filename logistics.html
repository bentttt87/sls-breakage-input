<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Database Ekspedisi SLS</title><style>:root{--b:#0b61b1;--n:#052e66;--l:#dbe5ef;--bg:#f5f8fc;--g:#07875a;--r:#c52b23}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#15304f}.top{background:linear-gradient(90deg,#073d7a,#0d6cc1);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px}.top b{font-size:18px}.top .grow{flex:1}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.p{background:var(--b);color:#fff}.s{background:#fff;border:1px solid #8caac8;color:var(--n)}.d{background:#fff;border:1px solid #efb6b0;color:#b42318}.wrap{max-width:1180px;margin:auto;padding:16px}.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:5px}.field input,.field select{width:100%;border:1px solid var(--l);border-radius:9px;padding:10px;background:#fff}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button.active{background:var(--n);color:#fff}.hint{font-size:11px;color:#5f7289;line-height:1.5}.msg{font-size:12px;margin-top:8px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:760px;font-size:12px}th,td{padding:9px;border-bottom:1px solid #edf1f5;text-align:left}th{background:#f6f8fb}.hidden{display:none!important}.login{max-width:400px;margin:70px auto}.badge{padding:3px 7px;border-radius:99px;background:#e7f7ee;color:#08774f;font-size:10px;font-weight:800}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:10px}.top b{font-size:15px}}@media(max-width:440px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><b>Database Ekspedisi SLS</b><span id="who"></span><div class="grow"></div><button class="btn s" onclick="location.href='/'">Breakage Input</button><button id="logout" class="btn s hidden">Keluar</button></div><div id="loginBox" class="wrap login"><div class="card"><h2 style="margin-top:0">Login</h2><div class="field"><label>User ID</label><input id="user" placeholder="SPV.JKT / MGR.SLS / MASTER.SLS"></div><div class="field" style="margin-top:10px"><label>Password</label><input id="pw" type="password"></div><button id="login" class="btn p" style="width:100%;margin-top:12px">Masuk</button><div id="loginMsg" class="msg"></div></div></div><div id="app" class="wrap hidden"><div class="card"><div class="grid"><div><b>Scope RDC</b><div id="scopeText" style="font-size:20px;font-weight:900;margin-top:4px">—</div></div><div><b>Hak Edit</b><div id="editText">—</div></div><div><b>Hak Delete</b><div id="deleteText">—</div></div><div class="field"><label>Filter RDC</label><select id="scope"><option>Jakarta</option><option>Semarang</option><option>Surabaya</option><option>Denpasar</option><option>Palembang</option></select></div></div><div class="hint" style="margin-top:10px">SPV hanya dapat input/edit database RDC sendiri. Master dapat delete. Manager Nasional bersifat read-only.</div></div><div class="tabs"><button class="btn s active" data-tab="vendor">Vendor Ekspedisi</button><button class="btn s" data-tab="driver">Driver</button><button class="btn s" data-tab="vehicle">No Polisi</button></div><div id="editor" class="card hidden"></div><div class="card"><div style="display:flex;align-items:center;gap:8px"><h3 id="title" style="margin:0">Vendor Ekspedisi</h3><div class="grow"></div><button id="add" class="btn p">+ Tambah</button><button id="refresh" class="btn s">↻ Refresh</button></div><div id="msg" class="msg"></div><div class="tablewrap" style="margin-top:10px"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></div></div><script>const SUPABASE_URL='https://mfdckngkvjnemwgmkiiv.supabase.co';const PUBLIC_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6Im1mZGNrbmdrdmpuZW13Z21raWl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMDcxMjUsImV4cCI6MjEwMTU4MzEyNX0.mFhv9hgQvjzg6AYfmEI2GiJ71I2xSkOozC43mwFcogU';let SESSION=null,ACCESS=null,DATA=null,TAB='vendor';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function auth(){return SESSION?.access_token||PUBLIC_ANON}async function rpc(fn,params={}){const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:PUBLIC_ANON,Authorization:`Bearer ${auth()}`,'Content-Type':'application/json'},body:JSON.stringify(params)});if(!r.ok)throw new Error(await r.text());return r.json()}async function signIn(){const u=$('user').value.trim(),p=$('pw').value;if(!u||!p)throw new Error('User ID dan password wajib');const email=await rpc('get_login_email',{input_username:u,input_password:p});if(!email)throw new Error('User ID tidak aktif');const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:PUBLIC_ANON,'Content-Type':'application/json'},body:JSON.stringify({email,password:p})});if(!r.ok)throw new Error('Password salah');SESSION=await r.json();ACCESS=await rpc('breakage_my_access_v44',{});sessionStorage.setItem('sls_logistics_session',JSON.stringify(SESSION));showApp()}async function showApp(){$('loginBox').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('who').textContent=`${ACCESS.username||''} · ${ACCESS.is_national?'Nasional':ACCESS.rdc_name}`;$('editText').innerHTML=ACCESS.can_manage_logistics?'<span class="badge">SPV — Input/Edit</span>':'Read Only';$('deleteText').innerHTML=ACCESS.can_delete_logistics?'<span class="badge">Master — Delete</span>':'Tidak';$('scope').disabled=!ACCESS.is_national;$('scope').value=ACCESS.is_national?'Jakarta':ACCESS.rdc_name;await load()}function scope(){return ACCESS.is_national?$('scope').value:ACCESS.rdc_name}async function load(){try{DATA=await rpc('logistics_master_list',{p_rdc:scope()});$('scopeText').textContent=scope();render()}catch(e){$('msg').textContent='Gagal memuat: '+e.message}}function vendorName(id){return DATA?.vendors?.find(x=>Number(x.id)===Number(id))?.name||'—'}function render(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===TAB));$('editor').classList.add('hidden');$('add').classList.toggle('hidden',!ACCESS.can_manage_logistics);if(TAB==='vendor'){ $('title').textContent='Vendor Ekspedisi';$('thead').innerHTML='<tr><th>Vendor</th><th>Kode</th><th>RDC</th><th>Status</th><th>Aksi</th></tr>';$('tbody').innerHTML=(DATA.vendors||[]).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.code||'—')}</td><td>${esc(x.rdc)}</td><td>${x.active?'Aktif':'Nonaktif'}</td><td>${actions('VENDOR',x)}</td></tr>`).join('')||'<tr><td colspan="5">Belum ada data.</td></tr>'}else if(TAB==='driver'){ $('title').textContent='Driver';$('thead').innerHTML='<tr><th>Driver</th><th>Vendor</th><th>Telepon</th><th>Status</th><th>Aksi</th></tr>';$('tbody').innerHTML=(DATA.drivers||[]).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.vendor_name)}</td><td>${esc(x.phone||'—')}</td><td>${x.active?'Aktif':'Nonaktif'}</td><td>${actions('DRIVER',x)}</td></tr>`).join('')||'<tr><td colspan="5">Belum ada data.</td></tr>'}else{$('title').textContent='No Polisi';$('thead').innerHTML='<tr><th>No Polisi</th><th>Vendor</th><th>Jenis Kendaraan</th><th>Status</th><th>Aksi</th></tr>';$('tbody').innerHTML=(DATA.vehicles||[]).map(x=>`<tr><td><b>${esc(x.plate)}</b></td><td>${esc(x.vendor_name)}</td><td>${esc(x.vehicle_type||'—')}</td><td>${x.active?'Aktif':'Nonaktif'}</td><td>${actions('VEHICLE',x)}</td></tr>`).join('')||'<tr><td colspan="5">Belum ada data.</td></tr>'}}function actions(type,x){let a='';if(ACCESS.can_manage_logistics&&x.rdc===ACCESS.rdc_name)a+=`<button class="btn s" onclick='editItem("${type}",${JSON.stringify(x)})'>Edit</button> `;if(ACCESS.can_delete_logistics)a+=`<button class="btn d" onclick='delItem("${type}",${x.id})'>Delete</button>`;return a||'—'}function vendorOptions(selected){return (DATA.vendors||[]).filter(v=>v.rdc===scope()&&v.active).map(v=>`<option value="${v.id}" ${Number(selected)===Number(v.id)?'selected':''}>${esc(v.name)}</option>`).join('')}window.editItem=(type,x)=>openEditor(type,x);$('add').onclick=()=>openEditor(TAB==='vendor'?'VENDOR':TAB==='driver'?'DRIVER':'VEHICLE',null);function openEditor(type,x){if(!ACCESS.can_manage_logistics)return;$('editor').classList.remove('hidden');if(type==='VENDOR')$('editor').innerHTML=`<h3>${x?'Edit':'Tambah'} Vendor</h3><div class="grid"><div class="field"><label>Nama Vendor *</label><input id="eName" value="${esc(x?.name||'')}"></div><div class="field"><label>Kode Vendor</label><input id="eCode" value="${esc(x?.code||'')}"></div><div class="field"><label>Status</label><select id="eActive"><option value="1">Aktif</option><option value="0" ${x&&!x.active?'selected':''}>Nonaktif</option></select></div></div><button class="btn p" style="margin-top:10px" onclick="saveVendor(${x?.id||'null'})">Simpan</button>`;else if(type==='DRIVER')$('editor').innerHTML=`<h3>${x?'Edit':'Tambah'} Driver</h3><div class="grid"><div class="field"><label>Vendor *</label><select id="eVendor"><option value="">Pilih</option>${vendorOptions(x?.vendor_id)}</select></div><div class="field"><label>Nama Driver *</label><input id="eName" value="${esc(x?.name||'')}"></div><div class="field"><label>Telepon</label><input id="ePhone" value="${esc(x?.phone||'')}"></div><div class="field"><label>Status</label><select id="eActive"><option value="1">Aktif</option><option value="0" ${x&&!x.active?'selected':''}>Nonaktif</option></select></div></div><button class="btn p" style="margin-top:10px" onclick="saveDriver(${x?.id||'null'})">Simpan</button>`;else $('editor').innerHTML=`<h3>${x?'Edit':'Tambah'} No Polisi</h3><div class="grid"><div class="field"><label>Vendor *</label><select id="eVendor"><option value="">Pilih</option>${vendorOptions(x?.vendor_id)}</select></div><div class="field"><label>No Polisi *</label><input id="ePlate" value="${esc(x?.plate||'')}"></div><div class="field"><label>Jenis Kendaraan</label><input id="eType" value="${esc(x?.vehicle_type||'')}"></div><div class="field"><label>Status</label><select id="eActive"><option value="1">Aktif</option><option value="0" ${x&&!x.active?'selected':''}>Nonaktif</option></select></div></div><button class="btn p" style="margin-top:10px" onclick="saveVehicle(${x?.id||'null'})">Simpan</button>`}$('refresh').onclick=load;$('scope').onchange=load;document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;render()});window.saveVendor=async id=>{try{await rpc('logistics_vendor_save',{p_id:id,p_rdc:scope(),p_vendor_name:$('eName').value,p_vendor_code:$('eCode').value,p_active:$('eActive').value==='1'});$('msg').textContent='Vendor tersimpan.';await load()}catch(e){$('msg').textContent=e.message}};window.saveDriver=async id=>{try{await rpc('logistics_driver_save',{p_id:id,p_rdc:scope(),p_vendor_id:Number($('eVendor').value),p_driver_name:$('eName').value,p_phone:$('ePhone').value,p_active:$('eActive').value==='1'});$('msg').textContent='Driver tersimpan.';await load()}catch(e){$('msg').textContent=e.message}};window.saveVehicle=async id=>{try{await rpc('logistics_vehicle_save',{p_id:id,p_rdc:scope(),p_vendor_id:Number($('eVendor').value),p_plate_no:$('ePlate').value,p_vehicle_type:$('eType').value,p_active:$('eActive').value==='1'});$('msg').textContent='No Polisi tersimpan.';await load()}catch(e){$('msg').textContent=e.message}};window.delItem=async(type,id)=>{if(!ACCESS.can_delete_logistics)return;const reason=prompt('Alasan delete wajib dicatat:');if(reason===null)return;try{await rpc('logistics_master_delete',{p_entity:type,p_id:id,p_reason:reason});$('msg').textContent='Data dihapus (soft delete + audit trail).';await load()}catch(e){$('msg').textContent=e.message}};$('login').onclick=()=>signIn().catch(e=>$('loginMsg').textContent=e.message);$('logout').onclick=()=>{sessionStorage.removeItem('sls_logistics_session');location.reload()};(async()=>{try{const raw=sessionStorage.getItem('sls_logistics_session');if(!raw)return;SESSION=JSON.parse(raw);ACCESS=await rpc('breakage_my_access_v44',{});showApp()}catch(_){sessionStorage.removeItem('sls_logistics_session')}})();</script></body></html>
