<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Form Stock Adjustment Bulanan - SLS</title>
<style>
  *{box-sizing:border-box} body{margin:0;background:#edf1f5;font-family:Arial,Helvetica,sans-serif;color:#111}
  .toolbar{position:sticky;top:0;z-index:5;background:#0c2748;color:#fff;padding:10px 14px;display:flex;gap:8px;align-items:center;box-shadow:0 2px 8px #0002}
  .toolbar b{font-size:14px}.toolbar .grow{flex:1}.toolbar button{border:0;border-radius:7px;padding:9px 14px;font-weight:700;cursor:pointer}.toolbar .print{background:#fff;color:#0c2748}
  .toolbar .close{background:#dfe8f2;color:#0c2748}
  .note{max-width:210mm;margin:10px auto 0;background:#fff7df;border:1px solid #eed28b;color:#5d4a14;padding:8px 12px;font-size:11px}
  .sheet{width:210mm;min-height:297mm;margin:12px auto;background:#fff;padding:13mm 13mm 15mm;box-shadow:0 2px 14px #0002}
  .head{display:grid;grid-template-columns:42mm 1fr 60mm;align-items:start;min-height:28mm}
  .logo-crop{width:34mm;height:24mm;overflow:hidden;position:relative}
  .logo-crop img{position:absolute;width:133mm;height:auto;left:-95mm;top:-2mm;max-width:none}
  .title{text-align:center;font-weight:700;font-size:14px;line-height:1.22;padding-top:7mm}
  .title .form{font-size:14px}
  .meta{font-size:11px;line-height:1.45;padding-top:8mm}
  .meta-row{display:grid;grid-template-columns:17mm 3mm 1fr}.edit{min-width:18mm;border-bottom:1px dotted transparent}.edit:focus{outline:1px dashed #7a9abc;background:#f8fbff}
  table{width:100%;border-collapse:collapse;font-size:11px} th,td{border:1.2px solid #111;padding:4px 5px;vertical-align:middle}
  thead th{text-align:center;font-weight:700}.no{width:9mm}.material{width:46mm}.kw{width:12mm}.uom{width:18mm}.qty{width:18mm}.ket{width:auto}
  tbody td:nth-child(1),tbody td:nth-child(3),tbody td:nth-child(4),tbody td:nth-child(5),tbody td:nth-child(6){text-align:center}
  .keterangan{white-space:pre-line;line-height:1.25;vertical-align:top!important;font-size:10.5px}
  .total-label{text-align:center!important;font-weight:700}.total-row td{font-weight:700}
  .signatures{display:grid;grid-template-columns:repeat(4,1fr);gap:7mm;margin-top:7mm;text-align:center;font-size:10.5px}
  .sig-role{font-weight:700;min-height:7mm}.sig-space{height:23mm}.sig-name{font-weight:700}
  .source{margin-top:8mm;border-top:1px solid #bbb;padding-top:3mm;font-size:9px;color:#666;display:flex;justify-content:space-between;gap:8mm}
  .appendix{width:210mm;margin:12px auto;background:#fff;padding:13mm;box-shadow:0 2px 14px #0002}
  .appendix h2{font-size:15px;margin:0 0 8px}.appendix table{font-size:9px}.appendix th,.appendix td{padding:3px}
  @media print{
    @page{size:A4 portrait;margin:0}
    body{background:#fff}.toolbar,.note{display:none!important}.sheet,.appendix{margin:0;box-shadow:none;width:210mm;min-height:297mm;page-break-after:always}
    .appendix{page-break-after:auto}.edit{border-bottom:0}
  }
</style>
</head>
<body>
<div class="toolbar"><b>FORM STOCK ADJUSMENT BULANAN</b><span class="grow"></span><button class="close" onclick="window.close()">Tutup</button><button class="print" onclick="window.print()">🖨 Print</button></div>
<div class="note">Kolom header, keterangan, dan nama penandatangan dapat diklik lalu diedit sebelum Print. Data kuantitas berasal otomatis dari Breakage Monitoring.</div>
<main id="app"></main>
<script>
(function(){
  const q=new URLSearchParams(location.search),key=q.get('k');
  const raw=key?localStorage.getItem(key):null;
  if(!raw){document.getElementById('app').innerHTML='<div class="sheet"><b style="color:#b42318">Data rekap tidak ditemukan. Buka kembali dari tombol Stock Adjustment Bulanan pada Breakage Input.</b></div>';return}
  let d;try{d=JSON.parse(raw)}catch(e){return}
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const fmt=n=>Number(n||0).toLocaleString('id-ID',{maximumFractionDigits:2});
  const fd=s=>{const x=new Date(s+'T00:00:00');return isNaN(x)?s:x.toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'}).toUpperCase()};
  const rowBy=(material,uom)=>d.rows.find(x=>x.material===material&&x.uom===uom)||{material,kw:'1',uom,in_qty:0,out_qty:0};
  const rows=[rowBy('Roman','BOX'),rowBy('Roman','PCS'),rowBy('Roman Granit','BOX'),rowBy('Roman Granit','PCS')];
  const firstRowspan=rows.length;
  const ket=esc(d.keterangan).replace(/\n/g,'<br>');
  const mainRows=rows.map((r,i)=>`<tr>
    ${i===0?'<td rowspan="'+firstRowspan+'">1.</td>':''}
    <td>${esc(r.material)}</td><td>${esc(r.kw||'1')}</td><td>${esc(r.uom)}</td>
    <td>${fmt(r.in_qty)}</td><td>${fmt(r.out_qty)}</td>
    ${i===0?'<td rowspan="'+firstRowspan+'" class="keterangan edit" contenteditable="true">'+ket+'</td>':''}
  </tr>`).join('');
  const totalRows=`<tr class="total-row"><td colspan="3" rowspan="2" class="total-label">Total</td><td>BOX</td><td>0</td><td>${fmt(d.total_box)}</td><td rowspan="2"></td></tr>
  <tr class="total-row"><td>PCS</td><td>0</td><td>${fmt(d.total_pcs)}</td></tr>`;
  const sig=[['Manager Distribusi','Mei Hoa'],['Manager Accounting','Irawati'],['Spv. Inventory Control','Deisy Siska'],['Senior Staff. Ware','Muhammad Arief']];
  document.getElementById('app').innerHTML=`
  <section class="sheet">
    <div class="head">
      <div class="logo-crop"><img src="https://raw.githubusercontent.com/bentttt87/sls-wms/main/quadra-roman-logo.svg?v=20260914-1617" alt="ROMAN"></div>
      <div class="title">PT. SATYA LANGGENG SENTOSA<br><span class="form">FORM STOCK ADJUSMENT</span></div>
      <div class="meta">
        <div class="meta-row"><span>Nomor</span><span>:</span><span class="edit" contenteditable="true">${esc(d.document_no||'')}</span></div>
        <div class="meta-row"><span>Tanggal</span><span>:</span><span class="edit" contenteditable="true">${esc(fd(d.document_date||''))}</span></div>
      </div>
    </div>
    <div style="font-size:11px;margin:-3mm 0 4mm">
      <div><b>Plant</b>&nbsp;&nbsp;&nbsp;&nbsp;: <span class="edit" contenteditable="true">${esc(d.plant)}</span></div>
      <div><b>Periode</b> : <span class="edit" contenteditable="true">${esc(d.period_label)}</span></div>
    </div>
    <table>
      <thead><tr><th class="no">NO.</th><th class="material">MATERIAL GROUP<br>/ MOTIF</th><th class="kw">KW</th><th class="uom">UOM</th><th class="qty">IN</th><th class="qty">OUT</th><th class="ket">KETERANGAN</th></tr></thead>
      <tbody>${mainRows}${totalRows}</tbody>
    </table>
    <div class="signatures">${sig.map(([role,name])=>`<div><div class="sig-role">${esc(role)}</div><div class="sig-space"></div><div class="sig-name edit" contenteditable="true">( ${esc(name)} )</div></div>`).join('')}</div>
    <div class="source"><span>Sumber: SLS Breakage Monitoring · ${esc(d.rdc)} · ${esc(d.period_label)}</span><span>${d.approved_incident_count} incident terverifikasi · dibuat ${new Date(d.generated_at).toLocaleString('id-ID')}</span></div>
  </section>
  <section class="appendix">
    <h2>Lampiran List Breakage — ${esc(d.rdc)} · ${esc(d.period_label)}</h2>
    <table><thead><tr><th>No</th><th>Tanggal</th><th>No BA</th><th>Item</th><th>Series/Motif</th><th>Jenis</th><th>Size</th><th>Qty</th><th>UOM</th><th>Pabrik</th><th>Foto</th></tr></thead><tbody>
    ${(d.incidents||[]).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.occurrence_date)}</td><td>${esc(x.no_ba||'—')}</td><td>${esc(x.item_code||'—')}</td><td>${esc(x.ceramic_series||'—')}</td><td>${esc(x.product_kind||x.product_type||'—')}</td><td>${esc(x.product_size||'—')}</td><td>${fmt(x.qty_box)}</td><td>${esc(x.uom||'BOX')}</td><td>${esc(x.factory||'—')}</td><td>${fmt(x.photo_count)}</td></tr>`).join('')}
    </tbody></table>
    <div style="font-size:9px;margin-top:6px;color:#666">Lampiran ini otomatis mengikuti incident yang sudah disetujui SPV / masuk review Master / final. Foto evidence tetap tersimpan pada Breakage Monitoring dan BA masing-masing.</div>
  </section>`;
})();
</script>
</body></html>
