<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Berita Acara + Foto - SLS</title>
<style>
:root{--ink:#111;--line:#111;--navy:#063a76;--muted:#667085}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#eef2f6;color:var(--ink);font-family:Arial,sans-serif}.toolbar{position:sticky;top:0;z-index:10;display:flex;gap:8px;justify-content:center;align-items:center;padding:10px;background:#fff;border-bottom:1px solid #d6dde7}.toolbar button{border:0;border-radius:8px;padding:10px 16px;font-weight:800;cursor:pointer}.toolbar .status{font-size:11px;color:var(--muted)}.primary{background:var(--navy);color:#fff}.primary:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#fff;border:1px solid #8da4bd!important;color:#183b62}.paper{width:210mm;min-height:297mm;margin:12px auto;background:#fff;padding:11mm 10mm 14mm;box-shadow:0 4px 24px rgba(0,0,0,.12)}.head{display:grid;grid-template-columns:42mm 1fr 33mm;align-items:start;margin-bottom:5mm}.logo img{width:38mm;max-height:25mm;height:auto;object-fit:contain;display:block}.title{text-align:center;padding-top:3mm}.title h1{font-size:14pt;margin:0 0 2mm}.title h2{font-size:11pt;margin:0;font-weight:800}.ref{text-align:right;font-size:7.5pt;line-height:1.35;color:#333;word-break:break-word;padding-top:2mm}.meta{width:80%;margin:3mm auto 7mm;border-collapse:collapse;font-size:10pt}.meta td{padding:1.5mm 1mm;vertical-align:bottom}.meta .label{width:43mm;font-weight:700}.meta .colon{width:5mm;text-align:center;font-weight:700}.meta .value{border-bottom:1px solid #222;min-height:6mm}.items{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9pt;margin-top:2mm}.items thead{display:table-header-group}.items tr{break-inside:avoid;page-break-inside:avoid}.items th,.items td{border:1px solid var(--line);padding:2mm 1.4mm;vertical-align:middle}.items th{text-align:center;font-weight:800}.items td:nth-child(1),.items td:nth-child(4),.items td:nth-child(5){text-align:center}.items col.no{width:8%}.items col.motif{width:24%}.items col.seri{width:18%}.items col.qty{width:12%}.items col.uom{width:12%}.items col.ket{width:26%}.blank-row td{height:9mm}.final-block{break-inside:avoid;page-break-inside:avoid}.chronology{margin-top:7mm;font-size:10pt}.chronology b{display:block;margin-bottom:3mm}.chronology .line{min-height:8mm;border-bottom:1px solid #222;padding:0 1mm 1mm;line-height:1.4}.signatures{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8mm;margin-top:9mm;font-size:9.5pt;text-align:center}.sig-title{min-height:8mm}.sig-space{height:22mm}.sig-line{white-space:nowrap}.sig-name{margin-top:2mm;text-align:left;padding-left:7mm}.foot{margin-top:6mm;font-size:7.5pt;color:#666;text-align:right}.evidence-page{width:210mm;min-height:297mm;margin:12px auto;background:#fff;padding:11mm 10mm 12mm;box-shadow:0 4px 24px rgba(0,0,0,.12);page-break-before:always;break-before:page}.ev-head{display:flex;align-items:center;gap:10mm;border-bottom:1px solid #aaa;padding-bottom:4mm;margin-bottom:5mm}.ev-head img{width:34mm;max-height:22mm;object-fit:contain}.ev-head h2{margin:0;font-size:14pt}.ev-head p{margin:1mm 0 0;font-size:9pt;color:#555}.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:6mm}.photo-card{border:1px solid #bbb;border-radius:3mm;padding:3mm;break-inside:avoid}.photo-card img{display:block;width:100%;height:93mm;object-fit:contain;background:#f7f7f7}.photo-cap{font-size:8.5pt;line-height:1.35;margin-top:2mm}.photo-cap b{display:block;font-size:9pt}.photo-error{height:93mm;display:flex;align-items:center;justify-content:center;text-align:center;padding:8mm;background:#fff3f1;color:#b42318;border:1px dashed #e0a09a}.error{width:min(760px,94vw);margin:50px auto;background:#fff;border:1px solid #efb5b0;color:#a11;padding:20px;border-radius:10px}@page{size:A4 portrait;margin:10mm 10mm 12mm}@media print{html,body{background:#fff}.toolbar{display:none!important}.paper,.evidence-page{width:auto;min-height:auto;margin:0;padding:0;box-shadow:none}.evidence-page{padding-top:0}.items{page-break-inside:auto}.items thead{display:table-header-group}.items tr,.final-block,.photo-card{page-break-inside:avoid;break-inside:avoid}}@media(max-width:900px){.paper,.evidence-page{width:100%;min-height:auto;margin:0;padding:18px;box-shadow:none}.meta{width:100%}.toolbar{position:relative;flex-wrap:wrap}.head{grid-template-columns:34mm 1fr}.ref{grid-column:1/-1;text-align:left;margin-top:3mm}.logo img{width:31mm}.signatures{gap:3mm}.photo-grid{grid-template-columns:1fr}.photo-card img{height:auto;max-height:70vh}}
</style>
</head>
<body>
<div class="toolbar"><button id="saveBtn" class="primary" disabled>⬇ Download / Save 1 PDF (BA + Foto)</button><span id="status" class="status">Memuat lampiran foto…</span><button class="secondary" onclick="window.close()">Tutup</button></div><div id="root"></div><div id="evidenceRoot"></div>
<script>
(async function(){
const BRAND_SRC='https://raw.githubusercontent.com/bentttt87/sls-wms/main/quadra-roman-logo.svg?v=20260914-1617';
const SUPABASE_URL='https://mfdckngkvjnemwgmkiiv.supabase.co';
const PUBLIC_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1mZGNrbmdrdmpuZW13Z21raWl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMDcxMjUsImV4cCI6MjEwMTU4MzEyNX0.mFhv9hgQvjzg6AYfmEI2GiJ71I2xSkOozC43mwFcogU';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const q=new URLSearchParams(location.search),key=q.get('k');let data=null;try{data=JSON.parse(localStorage.getItem(key)||'null')}catch(_){data=null}
const root=document.getElementById('root'),evRoot=document.getElementById('evidenceRoot'),status=document.getElementById('status'),saveBtn=document.getElementById('saveBtn');
if(!data){root.innerHTML='<div class="error"><b>Data BA tidak ditemukan.</b><br>Buka kembali SLS Breakage lalu pilih BA lagi.</div>';status.textContent='Data BA tidak tersedia';return}
const dateId=v=>{if(!v)return '—';const d=new Date(v+'T00:00:00');return new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'long',year:'numeric'}).format(d)};
const cleanDriver=(name,plate)=>{let n=String(name||'').trim(),p=String(plate||'').trim();if(p&&n.toUpperCase().startsWith(p.toUpperCase()+' - '))n=n.slice(p.length+3);return n||'—'};
const rows=(data.items||[]).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.item_code||'')}</td><td>${esc(x.ceramic_series||'')}</td><td>${esc(x.qty_box??'')}</td><td>${esc(x.uom||'BOX')}</td><td>${esc([x.cause,x.cause_detail].filter(Boolean).join(' - '))}</td></tr>`);while(rows.length<5)rows.push('<tr class="blank-row"><td>'+(rows.length+1)+'</td><td></td><td></td><td></td><td></td><td></td></tr>');
const chronology=[...new Set((data.items||[]).map(x=>[x.cause,x.cause_detail].filter(Boolean).join(' - ')).filter(Boolean))].join('; '),refs=[...new Set((data.items||[]).map(x=>x.no_ba).filter(Boolean))];
const receiver=data.receiver_name||(data.items||[]).find(x=>x.ba_receiver_name)?.ba_receiver_name||data.customer||'',witness=data.witness_name||(data.items||[]).find(x=>x.ba_witness_name)?.ba_witness_name||'';
root.innerHTML=`<main class="paper"><div class="head"><div class="logo"><img src="${BRAND_SRC}" alt="QUADRA ROMAN"></div><div class="title"><h1>BERITA ACARA KEPECAHAN PENGIRIMAN</h1><h2>RDC ${esc(String(data.rdc||'').toUpperCase())}</h2></div><div class="ref"><b>Referensi BA Sistem</b><br>${esc(refs.length?refs.join(', '):'—')}</div></div><table class="meta"><tr><td class="label">Tanggal Pemeriksaan</td><td class="colon">:</td><td class="value">${esc(dateId(data.occurrence_date))}</td></tr><tr><td class="label">Nama Penerima</td><td class="colon">:</td><td class="value">${esc(receiver)}</td></tr><tr><td class="label">No. Surat Jalan</td><td class="colon">:</td><td class="value">${esc(data.no_sj||'')}</td></tr><tr><td class="label">Pabrik Asal</td><td class="colon">:</td><td class="value">${esc(data.factory||'')}</td></tr><tr><td class="label">Nama Ekspedisi</td><td class="colon">:</td><td class="value">${esc(data.transporter||'')}</td></tr><tr><td class="label">Nama Pengemudi</td><td class="colon">:</td><td class="value">${esc(cleanDriver(data.driver_name,data.vehicle_no))}</td></tr><tr><td class="label">No. Polisi Armada</td><td class="colon">:</td><td class="value">${esc(data.vehicle_no||'')}</td></tr></table><table class="items"><colgroup><col class="no"><col class="motif"><col class="seri"><col class="qty"><col class="uom"><col class="ket"></colgroup><thead><tr><th>No</th><th>Motif</th><th>Seri</th><th>Jumlah Pecah</th><th>Satuan<br>(Box/PC)</th><th>Keterangan / Kondisi Kerusakan</th></tr></thead><tbody>${rows.join('')}</tbody></table><div class="final-block"><div class="chronology"><b>Kronologi Singkat Kejadian:</b><div class="line">${esc(chronology)}</div><div class="line"></div></div><div class="signatures"><div><div class="sig-title">Pihak I (Penerima Gudang)</div><div class="sig-space"></div><div class="sig-line">( ____________________ )</div><div class="sig-name">Nama: ${esc(receiver)}</div></div><div><div class="sig-title">Pihak II (Driver Ekspedisi)</div><div class="sig-space"></div><div class="sig-line">( ____________________ )</div><div class="sig-name">Nama: ${esc(cleanDriver(data.driver_name,data.vehicle_no)==='—'?'':cleanDriver(data.driver_name,data.vehicle_no))}</div></div><div><div class="sig-title">Saksi Pemeriksa</div><div class="sig-space"></div><div class="sig-line">( ____________________ )</div><div class="sig-name">Nama: ${esc(witness)}</div></div></div></div><div class="foot">Dicetak dari SLS Breakage · ${esc(new Date().toLocaleString('id-ID'))}</div></main>`;
function session(){for(const k of ['sls_breakage_input_session','sls_breakage_session']){try{const s=JSON.parse(sessionStorage.getItem(k)||'null');if(s?.access_token)return s}catch(_){}}return null}
async function token(){let s=session();if(!s)return null;if(s.expires_at&&Number(s.expires_at)*1000<Date.now()+30000&&s.refresh_token){try{const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:PUBLIC_ANON,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});if(r.ok){const n=await r.json();s={...s,...n};const k=sessionStorage.getItem('sls_breakage_input_session')?'sls_breakage_input_session':'sls_breakage_session';sessionStorage.setItem(k,JSON.stringify(s))}}catch(_){}}return s.access_token}
async function photoUrl(path){const t=await token();if(!t)throw new Error('Sesi login tidak ditemukan');const r=await fetch(`${SUPABASE_URL}/storage/v1/object/authenticated/breakage-evidence/${String(path).split('/').map(encodeURIComponent).join('/')}`,{headers:{apikey:PUBLIC_ANON,Authorization:`Bearer ${t}`}});if(!r.ok)throw new Error('Foto tidak dapat dimuat');return URL.createObjectURL(await r.blob())}
const photos=[];(data.items||[]).forEach(it=>(Array.isArray(it.photo_paths)?it.photo_paths:[]).forEach((p,i)=>photos.push({path:p,incident_no:it.incident_no,item_code:it.item_code,series:it.ceramic_series,index:i+1})));
if(!photos.length){status.textContent='BA siap. Tidak ada lampiran foto.';saveBtn.disabled=false;saveBtn.onclick=()=>window.print();return}
status.textContent=`Memuat ${photos.length} foto evidence…`;
let loaded=[];for(let i=0;i<photos.length;i++){const p=photos[i];try{loaded.push({...p,url:await photoUrl(p.path),ok:true})}catch(e){loaded.push({...p,ok:false,error:String(e.message||e)})}status.textContent=`Memuat foto ${i+1}/${photos.length}…`}
for(let start=0;start<loaded.length;start+=4){const chunk=loaded.slice(start,start+4),page=document.createElement('section');page.className='evidence-page';page.innerHTML=`<div class="ev-head"><img src="${BRAND_SRC}" alt="QUADRA ROMAN"><div><h2>LAMPIRAN FOTO EVIDENCE</h2><p>BA ${esc(refs[0]||'—')} · RDC ${esc(String(data.rdc||'').toUpperCase())} · ${esc(dateId(data.occurrence_date))}</p></div></div><div class="photo-grid">${chunk.map((p,j)=>`<div class="photo-card">${p.ok?`<img src="${p.url}" alt="Evidence ${start+j+1}">`:`<div class="photo-error">${esc(p.error||'Foto gagal dimuat')}</div>`}<div class="photo-cap"><b>Foto ${start+j+1} · ${esc(p.incident_no||'')}</b>Item: ${esc(p.item_code||'—')} · Series: ${esc(p.series||'—')}<br>Evidence ${esc(p.index)}</div></div>`).join('')}</div>`;evRoot.appendChild(page)}
await Promise.all([...evRoot.querySelectorAll('img')].map(img=>img.complete?Promise.resolve():new Promise(res=>{img.onload=img.onerror=res})));
const failed=loaded.filter(x=>!x.ok).length;status.textContent=failed?`BA siap; ${failed} foto gagal dimuat.`:`BA + ${loaded.length} foto siap menjadi 1 PDF.`;saveBtn.disabled=false;saveBtn.onclick=()=>window.print();
})();
</script>
</body>
</html>
