<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>BA + Foto - SLS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#eef2f6;font-family:Arial,sans-serif;color:#111}.toolbar{position:sticky;top:0;z-index:9;display:flex;gap:8px;align-items:center;justify-content:center;background:#fff;padding:10px;border-bottom:1px solid #ddd}.toolbar button{padding:10px 16px;border-radius:8px;border:0;font-weight:800;cursor:pointer}.primary{background:#063a76;color:#fff}.primary:disabled{opacity:.5}.secondary{background:#fff;color:#183b62;border:1px solid #8da4bd!important}.status{font-size:11px;color:#667085}.paper,.evpage{width:210mm;min-height:297mm;margin:12px auto;background:#fff;padding:9mm 10mm 13mm;box-shadow:0 4px 24px rgba(0,0,0,.12)}.brand-logo{text-align:center;margin-bottom:2mm}.brand-logo img{display:block;width:62mm;height:auto;margin:0 auto}.title{text-align:center;border-bottom:2px solid #111;padding-bottom:3mm}.title h1{font-size:15pt;margin:0 0 2mm}.title h2{font-size:11pt;margin:0}.ref{text-align:right;font-size:7.5pt;line-height:1.35;margin-top:2mm}.meta{width:82%;margin:4mm auto 6mm;border-collapse:collapse;font-size:10pt}.meta td{padding:1.3mm 1mm}.meta .l{width:43mm;font-weight:700}.meta .c{width:5mm;text-align:center}.meta .v{border-bottom:1px solid #222}.items{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9pt}.items thead{display:table-header-group}.items th,.items td{border:1px solid #111;padding:2mm 1.4mm}.items th{text-align:center}.items td:nth-child(1),.items td:nth-child(4),.items td:nth-child(5){text-align:center}.blank td{height:9mm}.final{break-inside:avoid;page-break-inside:avoid}.chron{margin-top:6mm;font-size:10pt}.chron .line{min-height:8mm;border-bottom:1px solid #222;padding:1mm}.sigs{display:grid;grid-template-columns:repeat(3,1fr);gap:8mm;margin-top:8mm;font-size:9.5pt;text-align:center}.space{height:20mm}.name{text-align:left;padding-left:7mm}.foot{text-align:right;font-size:7.5pt;color:#666;margin-top:5mm}.evpage{page-break-before:always;break-before:page}.evbrand{text-align:center;border-bottom:1px solid #aaa;padding-bottom:4mm;margin-bottom:5mm}.evbrand img{display:block;width:48mm;height:auto;margin:0 auto 2mm}.evbrand h2{font-size:14pt;margin:0}.evbrand p{font-size:9pt;color:#555;margin:1mm 0 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6mm}.card{border:1px solid #bbb;border-radius:3mm;padding:3mm;break-inside:avoid}.card img{width:100%;height:90mm;object-fit:contain;background:#f7f7f7}.cap{font-size:8.5pt;line-height:1.35;margin-top:2mm}.cap b{display:block;font-size:9pt}.err{height:90mm;display:flex;align-items:center;justify-content:center;text-align:center;padding:8mm;background:#fff3f1;color:#b42318;border:1px dashed #e0a09a}@page{size:A4 portrait;margin:9mm 9mm 11mm}@media print{body{background:#fff}.toolbar{display:none}.paper,.evpage{width:auto;min-height:auto;margin:0;padding:0;box-shadow:none}.evpage{page-break-before:always}.items tr,.card,.sigs,.final{page-break-inside:avoid;break-inside:avoid}}@media(max-width:900px){.paper,.evpage{width:100%;min-height:auto;margin:0;padding:16px;box-shadow:none}.brand-logo img{width:min(62mm,75vw)}.grid{grid-template-columns:1fr}.card img{height:auto;max-height:70vh}.toolbar{position:relative;flex-wrap:wrap}}
</style></head>
<body>
<div class="toolbar"><button id="saveBtn" class="primary" disabled>⬇ Download / Save 1 PDF (BA + Foto)</button><span id="status" class="status">Memuat lampiran foto…</span><button class="secondary" onclick="window.close()">Tutup</button></div>
<div id="root"></div><div id="evidenceRoot"></div>
<script>
(async function(){
const BRAND_SRC='https://raw.githubusercontent.com/bentttt87/sls-wms/main/quadra-roman-logo.svg?v=20260914-1645';
const SUPABASE_URL='https://mfdckngkvjnemwgmkiiv.supabase.co';
const PUBLIC_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1mZGNrbmdrdmpuZW13Z21raWl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMDcxMjUsImV4cCI6MjEwMTU4MzEyNX0.mFhv9hgQvjzg6AYfmEI2GiJ71I2xSkOozC43mwFcogU';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const q=new URLSearchParams(location.search),key=q.get('k');let data=null;try{data=JSON.parse(localStorage.getItem(key)||'null')}catch(_){data=null}
const root=document.getElementById('root'),evRoot=document.getElementById('evidenceRoot'),status=document.getElementById('status'),saveBtn=document.getElementById('saveBtn');
if(!data){root.innerHTML='<div style="margin:50px auto;max-width:720px;background:#fff;padding:20px;border:1px solid #e0a09a;border-radius:10px;color:#b42318"><b>Data BA tidak ditemukan.</b><br>Buka kembali SLS Breakage lalu pilih BA lagi.</div>';status.textContent='Data BA tidak tersedia';return}
const dateId=v=>{if(!v)return '—';const d=new Date(v+'T00:00:00');return new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'long',year:'numeric'}).format(d)};
const cleanDriver=(name,plate)=>{let n=String(name||'').trim(),p=String(plate||'').trim();if(p&&n.toUpperCase().startsWith(p.toUpperCase()+' - '))n=n.slice(p.length+3);return n||'—'};
const items=data.items||[];const rows=items.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.item_code||'')}</td><td>${esc(x.ceramic_series||'')}</td><td>${esc(x.qty_box??'')}</td><td>${esc(x.uom||'BOX')}</td><td>${esc([x.cause,x.cause_detail].filter(Boolean).join(' - '))}</td></tr>`);while(rows.length<5)rows.push(`<tr class="blank"><td>${rows.length+1}</td><td></td><td></td><td></td><td></td><td></td></tr>`);
const refs=[...new Set(items.map(x=>x.no_ba).filter(Boolean))],chron=[...new Set(items.map(x=>[x.cause,x.cause_detail].filter(Boolean).join(' - ')).filter(Boolean))].join('; '),receiver=data.receiver_name||items.find(x=>x.ba_receiver_name)?.ba_receiver_name||data.customer||'',witness=data.witness_name||items.find(x=>x.ba_witness_name)?.ba_witness_name||'';
root.innerHTML=`<main class="paper"><div class="brand-logo"><img src="${BRAND_SRC}" alt="QUADRA + ROMAN"></div><div class="title"><h1>BERITA ACARA KEPECAHAN PENGIRIMAN</h1><h2>RDC ${esc(String(data.rdc||'').toUpperCase())}</h2></div><div class="ref"><b>Referensi BA Sistem:</b> ${esc(refs.join(', ')||'—')}</div><table class="meta"><tr><td class="l">Tanggal Pemeriksaan</td><td class="c">:</td><td class="v">${esc(dateId(data.occurrence_date))}</td></tr><tr><td class="l">Nama Penerima</td><td class="c">:</td><td class="v">${esc(receiver)}</td></tr><tr><td class="l">No. Surat Jalan</td><td class="c">:</td><td class="v">${esc(data.no_sj||'')}</td></tr><tr><td class="l">Pabrik Asal</td><td class="c">:</td><td class="v">${esc(data.factory||'')}</td></tr><tr><td class="l">Nama Ekspedisi</td><td class="c">:</td><td class="v">${esc(data.transporter||'')}</td></tr><tr><td class="l">Nama Pengemudi</td><td class="c">:</td><td class="v">${esc(cleanDriver(data.driver_name,data.vehicle_no))}</td></tr><tr><td class="l">No. Polisi Armada</td><td class="c">:</td><td class="v">${esc(data.vehicle_no||'')}</td></tr></table><table class="items"><colgroup><col style="width:8%"><col style="width:24%"><col style="width:18%"><col style="width:12%"><col style="width:12%"><col style="width:26%"></colgroup><thead><tr><th>No</th><th>Motif</th><th>Seri</th><th>Jumlah Pecah</th><th>Satuan<br>(Box/PC)</th><th>Keterangan / Kondisi Kerusakan</th></tr></thead><tbody>${rows.join('')}</tbody></table><div class="final"><div class="chron"><b>Kronologi Singkat Kejadian:</b><div class="line">${esc(chron)}</div><div class="line"></div></div><div class="sigs"><div><div>Pihak I (Penerima Gudang)</div><div class="space"></div><div>( ____________________ )</div><div class="name">Nama: ${esc(receiver)}</div></div><div><div>Pihak II (Driver Ekspedisi)</div><div class="space"></div><div>( ____________________ )</div><div class="name">Nama: ${esc(cleanDriver(data.driver_name,data.vehicle_no)==='—'?'':cleanDriver(data.driver_name,data.vehicle_no))}</div></div><div><div>Saksi Pemeriksa</div><div class="space"></div><div>( ____________________ )</div><div class="name">Nama: ${esc(witness)}</div></div></div></div><div class="foot">Dicetak dari SLS Breakage · ${esc(new Date().toLocaleString('id-ID'))}</div></main>`;
function getSession(){for(const k of ['sls_breakage_input_session','sls_breakage_session']){try{const s=JSON.parse(sessionStorage.getItem(k)||'null');if(s?.access_token)return s}catch(_){}}return null}
async function token(){let s=getSession();if(!s)return null;if(s.expires_at&&Number(s.expires_at)*1000<Date.now()+30000&&s.refresh_token){try{const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:PUBLIC_ANON,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});if(r.ok){const n=await r.json();s={...s,...n}}}catch(_){}}return s.access_token}
async function photoUrl(path){const t=await token();if(!t)throw new Error('Sesi login tidak ditemukan');const r=await fetch(`${SUPABASE_URL}/storage/v1/object/authenticated/breakage-evidence/${String(path).split('/').map(encodeURIComponent).join('/')}`,{headers:{apikey:PUBLIC_ANON,Authorization:`Bearer ${t}`},cache:'no-store'});if(!r.ok)throw new Error('Foto tidak dapat dimuat');return URL.createObjectURL(await r.blob())}
const photos=[];items.forEach(it=>(Array.isArray(it.photo_paths)?it.photo_paths:[]).forEach((p,i)=>photos.push({path:p,incident_no:it.incident_no,item_code:it.item_code,series:it.ceramic_series,index:i+1})));
if(!photos.length){status.textContent='BA siap. Tidak ada lampiran foto.';saveBtn.disabled=false;saveBtn.onclick=()=>window.print();return}
let loaded=[];for(let i=0;i<photos.length;i++){status.textContent=`Memuat foto ${i+1}/${photos.length}…`;try{loaded.push({...photos[i],url:await photoUrl(photos[i].path),ok:true})}catch(e){loaded.push({...photos[i],ok:false,error:String(e.message||e)})}}
for(let start=0;start<loaded.length;start+=4){const chunk=loaded.slice(start,start+4),page=document.createElement('section');page.className='evpage';page.innerHTML=`<div class="evbrand"><img src="${BRAND_SRC}" alt="QUADRA + ROMAN"><h2>LAMPIRAN FOTO EVIDENCE</h2><p>BA ${esc(refs[0]||'—')} · RDC ${esc(String(data.rdc||'').toUpperCase())} · ${esc(dateId(data.occurrence_date))}</p></div><div class="grid">${chunk.map((p,j)=>`<div class="card">${p.ok?`<img src="${p.url}" alt="Evidence ${start+j+1}">`:`<div class="err">${esc(p.error||'Foto gagal dimuat')}</div>`}<div class="cap"><b>Foto ${start+j+1} · ${esc(p.incident_no||'')}</b>Item: ${esc(p.item_code||'—')} · Series: ${esc(p.series||'—')}<br>Evidence ${esc(p.index)}</div></div>`).join('')}</div>`;evRoot.appendChild(page)}
await Promise.all([...document.images].map(img=>img.complete?Promise.resolve():new Promise(res=>{img.onload=img.onerror=res})));
const failed=loaded.filter(x=>!x.ok).length;status.textContent=failed?`BA siap; ${failed} foto gagal dimuat.`:`BA + ${loaded.length} foto siap menjadi 1 PDF.`;saveBtn.disabled=false;saveBtn.onclick=()=>window.print();
})();
</script></body></html>
