<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Berita Acara Kepecahan Pengiriman - SLS</title>
<style>
:root{--ink:#111;--line:#111;--navy:#063a76}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#eef2f6;color:var(--ink);font-family:Arial,sans-serif}.toolbar{position:sticky;top:0;z-index:10;display:flex;gap:8px;justify-content:center;padding:10px;background:#fff;border-bottom:1px solid #d6dde7}.toolbar button{border:0;border-radius:8px;padding:10px 16px;font-weight:800;cursor:pointer}.primary{background:var(--navy);color:#fff}.secondary{background:#fff;border:1px solid #8da4bd!important;color:#183b62}.paper{width:210mm;min-height:297mm;margin:12px auto;background:#fff;padding:12mm 11mm 14mm;box-shadow:0 4px 24px rgba(0,0,0,.12)}.head{display:grid;grid-template-columns:24mm 1fr 24mm;align-items:start;margin-bottom:5mm}.logo svg{width:18mm;height:auto}.title{text-align:center;padding-top:2mm}.title h1{font-size:15pt;margin:0 0 2mm}.title h2{font-size:11pt;margin:0;font-weight:800}.ref{text-align:right;font-size:7.5pt;line-height:1.35;color:#333;word-break:break-word}.meta{width:78%;margin:3mm auto 7mm;border-collapse:collapse;font-size:10pt}.meta td{padding:1.5mm 1mm;vertical-align:bottom}.meta .label{width:43mm;font-weight:700}.meta .colon{width:5mm;text-align:center;font-weight:700}.meta .value{border-bottom:1px solid #222;min-height:6mm}.items{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9pt;margin-top:2mm}.items thead{display:table-header-group}.items tr{break-inside:avoid;page-break-inside:avoid}.items th,.items td{border:1px solid var(--line);padding:2mm 1.4mm;vertical-align:middle}.items th{text-align:center;font-weight:800}.items td:nth-child(1),.items td:nth-child(4),.items td:nth-child(5){text-align:center}.items col.no{width:8%}.items col.motif{width:24%}.items col.seri{width:18%}.items col.qty{width:12%}.items col.uom{width:12%}.items col.ket{width:26%}.blank-row td{height:9mm}.final-block{break-inside:avoid;page-break-inside:avoid}.chronology{margin-top:7mm;font-size:10pt}.chronology b{display:block;margin-bottom:3mm}.chronology .line{min-height:8mm;border-bottom:1px solid #222;padding:0 1mm 1mm;line-height:1.4}.signatures{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8mm;margin-top:9mm;font-size:9.5pt;text-align:center}.sig-title{min-height:8mm}.sig-space{height:22mm}.sig-line{white-space:nowrap}.sig-name{margin-top:2mm;text-align:left;padding-left:7mm}.foot{margin-top:6mm;font-size:7.5pt;color:#666;text-align:right}.error{width:min(760px,94vw);margin:50px auto;background:#fff;border:1px solid #efb5b0;color:#a11;padding:20px;border-radius:10px}@page{size:A4 portrait;margin:10mm 10mm 12mm}@media print{html,body{background:#fff}.toolbar{display:none!important}.paper{width:auto;min-height:auto;margin:0;padding:0;box-shadow:none}.items{page-break-inside:auto}.items thead{display:table-header-group}.items tr{page-break-inside:avoid;break-inside:avoid}.final-block{page-break-inside:avoid;break-inside:avoid}.foot{position:static}}@media(max-width:900px){.paper{width:100%;min-height:auto;margin:0;padding:18px;box-shadow:none}.meta{width:100%}.toolbar{position:relative}.head{grid-template-columns:18mm 1fr}.ref{grid-column:1/-1;text-align:left;margin-top:3mm}.signatures{gap:3mm}}
</style>
</head>
<body>
<div class="toolbar"><button class="primary" onclick="window.print()">🖨 Print / Save PDF</button><button class="secondary" onclick="window.close()">Tutup</button></div><div id="root"></div>
<script>
(function(){const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const q=new URLSearchParams(location.search),key=q.get('k');let data=null;try{data=JSON.parse(localStorage.getItem(key)||'null')}catch(_){data=null}const root=document.getElementById('root');if(!data){root.innerHTML='<div class="error"><b>Data BA tidak ditemukan.</b><br>Buka kembali SLS Breakage Input lalu klik Print BA.</div>';return}const dateId=v=>{if(!v)return '—';const d=new Date(v+'T00:00:00');return new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'long',year:'numeric'}).format(d)};const cleanDriver=(name,plate)=>{let n=String(name||'').trim(),p=String(plate||'').trim();if(p&&n.toUpperCase().startsWith(p.toUpperCase()+' - '))n=n.slice(p.length+3);return n||'—'};const rows=(data.items||[]).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.item_code||'')}</td><td>${esc(x.ceramic_series||'')}</td><td>${esc(x.qty_box??'')}</td><td>${esc(x.uom||'BOX')}</td><td>${esc([x.cause,x.cause_detail].filter(Boolean).join(' - '))}</td></tr>`);while(rows.length<5)rows.push('<tr class="blank-row"><td>'+(rows.length+1)+'</td><td></td><td></td><td></td><td></td><td></td></tr>');const chronology=[...new Set((data.items||[]).map(x=>[x.cause,x.cause_detail].filter(Boolean).join(' - ')).filter(Boolean))].join('; ');const refs=[...new Set((data.items||[]).map(x=>x.no_ba).filter(Boolean))];const receiver=data.receiver_name||(data.items||[]).find(x=>x.ba_receiver_name)?.ba_receiver_name||data.customer||'';const witness=data.witness_name||(data.items||[]).find(x=>x.ba_witness_name)?.ba_witness_name||'';root.innerHTML=`<main class="paper"><div class="head"><div class="logo"><svg viewBox="0 0 100 80" aria-label="ROMAN"><path d="M12 47A38 38 0 0 1 88 47" fill="none" stroke="#ef1b2d" stroke-width="12"/><path d="M23 47A27 27 0 0 1 77 47" fill="none" stroke="#ffd21d" stroke-width="8"/><path d="M17 49h66l-8 10H25z" fill="#061b3c"/><circle cx="50" cy="48" r="8" fill="#ffd21d" stroke="#061b3c" stroke-width="4"/><text x="50" y="75" text-anchor="middle" font-size="18" font-weight="900" font-style="italic" fill="#ef1b2d">ROMAN</text></svg></div><div class="title"><h1>BERITA ACARA KEPECAHAN PENGIRIMAN</h1><h2>RDC ${esc(String(data.rdc||'').toUpperCase())}</h2></div><div class="ref"><b>Referensi BA Sistem</b><br>${esc(refs.length?refs.join(', '):'—')}</div></div><table class="meta"><tr><td class="label">Tanggal Pemeriksaan</td><td class="colon">:</td><td class="value">${esc(dateId(data.occurrence_date))}</td></tr><tr><td class="label">Nama Penerima</td><td class="colon">:</td><td class="value">${esc(receiver)}</td></tr><tr><td class="label">No. Surat Jalan</td><td class="colon">:</td><td class="value">${esc(data.no_sj||'')}</td></tr><tr><td class="label">Nama Ekspedisi</td><td class="colon">:</td><td class="value">${esc(data.transporter||'')}</td></tr><tr><td class="label">Nama Pengemudi</td><td class="colon">:</td><td class="value">${esc(cleanDriver(data.driver_name,data.vehicle_no))}</td></tr><tr><td class="label">No. Polisi Armada</td><td class="colon">:</td><td class="value">${esc(data.vehicle_no||'')}</td></tr></table><table class="items"><colgroup><col class="no"><col class="motif"><col class="seri"><col class="qty"><col class="uom"><col class="ket"></colgroup><thead><tr><th>No</th><th>Motif</th><th>Seri</th><th>Jumlah Pecah</th><th>Satuan<br>(Box/PC)</th><th>Keterangan / Kondisi Kerusakan</th></tr></thead><tbody>${rows.join('')}</tbody></table><div class="final-block"><div class="chronology"><b>Kronologi Singkat Kejadian:</b><div class="line">${esc(chronology)}</div><div class="line"></div></div><div class="signatures"><div><div class="sig-title">Pihak I (Penerima Gudang)</div><div class="sig-space"></div><div class="sig-line">( ____________________ )</div><div class="sig-name">Nama: ${esc(receiver)}</div></div><div><div class="sig-title">Pihak II (Driver Ekspedisi)</div><div class="sig-space"></div><div class="sig-line">( ____________________ )</div><div class="sig-name">Nama: ${esc(cleanDriver(data.driver_name,data.vehicle_no)==='—'?'':cleanDriver(data.driver_name,data.vehicle_no))}</div></div><div><div class="sig-title">Saksi Pemeriksa</div><div class="sig-space"></div><div class="sig-line">( ____________________ )</div><div class="sig-name">Nama: ${esc(witness)}</div></div></div></div><div class="foot">Dicetak dari SLS Breakage · ${esc(new Date().toLocaleString('id-ID'))}</div></main>`})();
</script>
</body>
</html>
